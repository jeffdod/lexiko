<link rel="preload" href="fonts/lexiko-serif-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // apply a manually chosen theme before first paint (auto = follow the system, handled in CSS)
  try { var t = localStorage.getItem('lexiko-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1" aria-live="polite"></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<div id="loading" role="status">
  <div class="box">
    <div class="word"><span>λ</span>exiko</div>
    <div class="bar accent"><i id="loadbar" style="width:4%"></i></div>
    <p class="muted small" id="loadmsg" style="margin-top:.8rem">Loading the Greek New Testament…</p>
  </div>
</div>
<noscript><p style="padding:1rem">lexiko needs JavaScript to run.</p></noscript>
<script>
  // Opened straight from disk (file://)? Browsers refuse to load the app's modules and data that way, so explain instead of spinning forever.
  (function () {
    var msg = document.getElementById('loadmsg'), bar = document.getElementById('loadbar');
    function explain() {
      if (!msg || !document.getElementById('loading') || document.getElementById('loading').classList.contains('done')) return;
      if (bar && bar.parentNode) bar.parentNode.style.display = 'none';
      msg.style.cssText = 'margin-top:.8rem;line-height:1.5';
      msg.innerHTML = 'lexiko can’t run when index.html is opened directly from a folder — browsers block that for security.<br><br>' +
        'Use it at <a href="https://lexiko.org/">lexiko.org</a> (add it to your home screen or install it and it works offline), ' +
        'or serve this folder locally, e.g. run <b>python3 -m http.server</b> in it and open <b>http://localhost:8000</b>.';
    }
    if (location.protocol === 'file:') explain(); else setTimeout(function () { if (document.getElementById('loading')) explain2(); }, 20000);
    function explain2() { if (msg) msg.innerHTML = 'This is taking longer than expected. Check your connection and reload; if it keeps happening, reload with the page’s cache cleared.'; }
  })();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
