<!doctype html>

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta property="og:site_name" content="lexiko">
<meta property="og:title" content="lexiko — learn to read the Greek New Testament">

<link rel="preload" href="fonts/lexiko-serif-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // apply a manually chosen theme before first paint (auto = follow the system, handled in CSS)
  try { var t = localStorage.getItem('lexiko-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1" aria-live="polite"></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<div id="loading" role="status">
  <div class="box">
    <div class="word"><span>λ</span>exiko</div>
    <div class="bar accent"><i id="loadbar" style="width:4%"></i></div>
    <p class="muted small" id="loadmsg" style="margin-top:.8rem">Loading the Greek New Testament…</p>
  </div>
</div>
<noscript><p style="padding:1rem">lexiko needs JavaScript to run.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
